# ============================================================================
# sf_spec.yaml — 自定义快速数学近似 (SFU)
# ============================================================================

families:

  - name: sf
    template: sf
    desc: "Special Function fast math"
    instructions:
      - { name: fexp_s,     expr: "fastexp(v)",
          decode: { pattern: "0110000 00000 ????? ??? ????? 10100 11",
                    type: TYPE_FR, imm: imm0 } }
      - { name: fln_s,      expr: "logf(v)",
          decode: { pattern: "0110000 00001 ????? ??? ????? 10100 11",
                    type: TYPE_FR, imm: imm0 } }
      - { name: frcp_s,     expr: "1.0f / v",
          decode: { pattern: "0110000 00010 ????? ??? ????? 10100 11",
                    type: TYPE_FR, imm: imm0 } }
      - { name: frsqrt_s,   expr: "fastrsqrt(v)",
          decode: { pattern: "0110000 00011 ????? ??? ????? 10100 11",
                    type: TYPE_FR, imm: imm0 } }
      - { name: ftanh_s,    expr: "fasttanh(v)",
          decode: { pattern: "0110000 00100 ????? ??? ????? 10100 11",
                    type: TYPE_FR, imm: imm0 } }
      - { name: fsigmoid_s, expr: "fastsigmoid(v)",
          decode: { pattern: "0110000 00101 ????? ??? ????? 10100 11",
                    type: TYPE_FR, imm: imm0 } }
      - { name: fsin_s,     expr: "sinf(v)",
          decode: { pattern: "0110000 00110 ????? ??? ????? 10100 11",
                    type: TYPE_FR, imm: imm0 } }
      - { name: fcos_s,     expr: "cosf(v)",
          decode: { pattern: "0110000 00111 ????? ??? ????? 10100 11",
                    type: TYPE_FR, imm: imm0 } }

  # ── 向量 SFU 一元 (custom-1 opcode 0x2B) ────────────────────
  - name: sf_vec
    template: sf_vec
    desc: "Vector SFU unary (custom-1 0x2B)"
    instructions:
      - { name: vfexp_v,   expr: "fastexp(v)",
          decode: { pattern: "0110000 00000 ????? 010 ????? 01010 11",
                    type: TYPE_R, imm: imm0 } }
      - { name: vfsig_v,   expr: "1.0f / (1.0f + fastexp(-v))",
          decode: { pattern: "0110000 00000 ????? 011 ????? 01010 11",
                    type: TYPE_R, imm: imm0 } }
      - { name: vftanh_v,  expr: "fasttanh(v)",
          decode: { pattern: "0110000 00000 ????? 100 ????? 01010 11",
                    type: TYPE_R, imm: imm0 } }

  # ── 向量 SFU 归约 (custom-1 opcode 0x2B) ─────────────────────
  - name: sf_red
    template: sf_red
    desc: "Vector SFU reduction (custom-1 0x2B)"
    instructions:
      - { name: vredsum_v, expr: "vredsum(v)",
          decode: { pattern: "0110000 00000 ????? 000 ????? 01010 11",
                    type: TYPE_R, imm: imm0 } }
      - { name: vredmax_v, op: max,
          decode: { pattern: "0110000 00000 ????? 001 ????? 01010 11",
                    type: TYPE_R, imm: imm0 } }
