# ============================================================================
# misc_spec.yaml — 自定义非标准指令 (无标准 ISA 归属)
#
# MMA 指令已迁移到 inst/mma/。
# 旧 VPU custom 指令 (vld_v, vfadd_v, ...) 已删除, 被标准 RVV 替代。
# ============================================================================

misc:
  - { name: tex, template: tex,
      decode: { pattern: "0000000 00000 00000 000 00001 00010 11",
                type: TYPE_I, imm: immI } }
  - { name: barrier, template: barrier,
      decode: { pattern: "0000000 00000 00000 000 00000 00010 11",
                type: TYPE_I, imm: imm0 } }
