# ============================================================================
# lp_spec.yaml — 自定义低精度浮点转换 (LPFP)
# ============================================================================

families:

  - name: lp_convert
    template: lp_convert
    desc: "Low-precision float convert (bf16/e4m3/e5m2/e2m1)"
    instructions:
      - { name: fcvt_s_bf16,  dir: to_f32, load: "bf16_to_f32((uint16_t)(FPR(rs1, _li) >> 16))", store_fn: "",
          decode: { pattern: "0100010 00000 ????? ??? ????? 10100 11",
                    type: TYPE_FR, imm: imm0 } }
      - { name: fcvt_bf16_s,  dir: from_f32, load: "f32_to_bf16(FPR(rs1, _li))", store_fn: "FPR(rd, _li) = (uint32_t)val << 16",
          decode: { pattern: "0100010 00001 ????? ??? ????? 10100 11",
                    type: TYPE_FR, imm: imm0 } }
      - { name: fcvt_s_e4m3,  dir: to_f32, load: "e4m3_to_f32((uint8_t)(FPR(rs1, _li) >> 24))", store_fn: "",
          decode: { pattern: "0100100 00000 ????? ??? ????? 10100 11",
                    type: TYPE_FR, imm: imm0 } }
      - { name: fcvt_e4m3_s,  dir: from_f32, load: "f32_to_e4m3(FPR(rs1, _li))", store_fn: "FPR(rd, _li) = (uint32_t)val << 24",
          decode: { pattern: "0100100 00001 ????? ??? ????? 10100 11",
                    type: TYPE_FR, imm: imm0 } }
      - { name: fcvt_s_e5m2,  dir: to_f32, load: "e5m2_to_f32((uint8_t)(FPR(rs1, _li) >> 24))", store_fn: "",
          decode: { pattern: "0100100 00010 ????? ??? ????? 10100 11",
                    type: TYPE_FR, imm: imm0 } }
      - { name: fcvt_e5m2_s,  dir: from_f32, load: "f32_to_e5m2(FPR(rs1, _li))", store_fn: "FPR(rd, _li) = (uint32_t)val << 24",
          decode: { pattern: "0100100 00011 ????? ??? ????? 10100 11",
                    type: TYPE_FR, imm: imm0 } }
      - { name: fcvt_s_e2m1,  dir: to_f32, load: "e2m1_to_f32((uint8_t)(FPR(rs1, _li) >> 24))", store_fn: "",
          decode: { pattern: "0100110 00000 ????? ??? ????? 10100 11",
                    type: TYPE_FR, imm: imm0 } }
      - { name: fcvt_e2m1_s,  dir: from_f32, load: "f32_to_e2m1(FPR(rs1, _li))", store_fn: "FPR(rd, _li) = (uint32_t)val << 24",
          decode: { pattern: "0100110 00001 ????? ??? ????? 10100 11",
                    type: TYPE_FR, imm: imm0 } }
