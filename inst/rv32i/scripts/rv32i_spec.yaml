# ============================================================================
# rv32i_spec.yaml — RV32I 基础整数指令集规格 (单源真相)
#
# 每条指令包含:
#   execute info — handler 生成所需 (op / signed / type / ...)
#   decode info  — dispatch trie 所需 (pattern / type / imm)
#
# decode 字段:
#   pattern: 位模式 (0/1/?/?=don't-care, 空格分隔)
#   type:    TYPE_R / TYPE_I / TYPE_U / TYPE_S / TYPE_J / TYPE_B / TYPE_CSR
#   imm:     imm0 / immI / immU / immS / immJ / immB / immCSR
#   label:   可选, handler 标签名 (默认 = op_{name})
# ============================================================================

families:

  # =========================================================================
  # ALU 立即数: rd = rs1 OP imm
  # =========================================================================
  - name: alu_imm
    template: alu_imm
    desc: "ALU immediate (addi/xori/ori/andi)"
    instructions:
      - { name: addi, op: "+",
          decode: { pattern: "??????? ????? ????? 000 ????? 00100 11",
                    type: TYPE_I, imm: immI } }
      - { name: xori, op: "^",
          decode: { pattern: "??????? ????? ????? 100 ????? 00100 11",
                    type: TYPE_I, imm: immI } }
      - { name: ori,  op: "|",
          decode: { pattern: "??????? ????? ????? 110 ????? 00100 11",
                    type: TYPE_I, imm: immI } }
      - { name: andi, op: "&",
          decode: { pattern: "??????? ????? ????? 111 ????? 00100 11",
                    type: TYPE_I, imm: immI } }

  # =========================================================================
  # 比较立即数: rd = (rs1 OP imm) ? 1 : 0
  # =========================================================================
  - name: slti_imm
    template: slti_imm
    desc: "Set if less than immediate (slti/sltiu)"
    instructions:
      - { name: slti,  signed: true,
          decode: { pattern: "??????? ????? ????? 010 ????? 00100 11",
                    type: TYPE_I, imm: immI } }
      - { name: sltiu, signed: false,
          decode: { pattern: "??????? ????? ????? 011 ????? 00100 11",
                    type: TYPE_I, imm: immI } }

  # =========================================================================
  # 移位立即数: rd = rs1 OP (imm & mask)
  # =========================================================================
  - name: shift_imm
    template: shift_imm
    desc: "Shift immediate (slli/srli/srai)"
    instructions:
      - { name: slli, op: "<<", signed: false,
          decode: { pattern: "0000000 ????? ????? 001 ????? 00100 11",
                    type: TYPE_I, imm: immI } }
      - { name: srli, op: ">>", signed: false,
          decode: { pattern: "0000000 ????? ????? 101 ????? 00100 11",
                    type: TYPE_I, imm: immI } }
      - { name: srai, op: ">>", signed: true,
          decode: { pattern: "0100000 ????? ????? 101 ????? 00100 11",
                    type: TYPE_I, imm: immI } }

  # =========================================================================
  # ALU 寄存器: rd = rs1 OP rs2
  # =========================================================================
  - name: alu_reg
    template: alu_reg
    desc: "ALU register (add/sub/xor/or/and)"
    instructions:
      - { name: add, op: "+",
          decode: { pattern: "0000000 ????? ????? 000 ????? 01100 11",
                    type: TYPE_R, imm: imm0 } }
      - { name: sub, op: "-",
          decode: { pattern: "0100000 ????? ????? 000 ????? 01100 11",
                    type: TYPE_R, imm: imm0 } }
      - { name: xor, op: "^",
          decode: { pattern: "0000000 ????? ????? 100 ????? 01100 11",
                    type: TYPE_R, imm: imm0 } }
      - { name: or,  op: "|",
          decode: { pattern: "0000000 ????? ????? 110 ????? 01100 11",
                    type: TYPE_R, imm: imm0 } }
      - { name: and, op: "&",
          decode: { pattern: "0000000 ????? ????? 111 ????? 01100 11",
                    type: TYPE_R, imm: imm0 } }

  # =========================================================================
  # 移位寄存器: rd = rs1 OP (rs2 & mask)
  # =========================================================================
  - name: shift_reg
    template: shift_reg
    desc: "Shift register (sll/srl/sra)"
    instructions:
      - { name: sll, op: "<<", signed: false,
          decode: { pattern: "0000000 ????? ????? 001 ????? 01100 11",
                    type: TYPE_R, imm: imm0 } }
      - { name: srl, op: ">>", signed: false,
          decode: { pattern: "0000000 ????? ????? 101 ????? 01100 11",
                    type: TYPE_R, imm: imm0 } }
      - { name: sra, op: ">>", signed: true,
          decode: { pattern: "0100000 ????? ????? 101 ????? 01100 11",
                    type: TYPE_R, imm: imm0 } }

  # =========================================================================
  # 比较寄存器: rd = (rs1 OP rs2) ? 1 : 0
  # =========================================================================
  - name: slt_reg
    template: slt_reg
    desc: "Set if less than register (slt/sltu)"
    instructions:
      - { name: slt,  signed: true,
          decode: { pattern: "0000000 ????? ????? 010 ????? 01100 11",
                    type: TYPE_R, imm: imm0 } }
      - { name: sltu, signed: false,
          decode: { pattern: "0000000 ????? ????? 011 ????? 01100 11",
                    type: TYPE_R, imm: imm0 } }

  # =========================================================================
  # 无条件跳转
  # =========================================================================
  - name: jump
    template: jump
    desc: "Unconditional jumps (jal/jalr)"
    instructions:
      - { name: jal,  type: jal,
          decode: { pattern: "??????? ????? ????? ??? ????? 11011 11",
                    type: TYPE_J, imm: immJ } }
      - { name: jalr, type: jalr,
          decode: { pattern: "??????? ????? ????? 000 ????? 11001 11",
                    type: TYPE_I, imm: immI } }

  # =========================================================================
  # 高位立即数
  # =========================================================================
  - name: upper_imm
    template: upper_imm
    desc: "Upper immediate (lui/auipc)"
    instructions:
      - { name: lui,   type: lui,
          decode: { pattern: "??????? ????? ????? ??? ????? 01101 11",
                    type: TYPE_U, imm: immU } }
      - { name: auipc, type: auipc,
          decode: { pattern: "??????? ????? ????? ??? ????? 00101 11",
                    type: TYPE_U, imm: immU } }

  # =========================================================================
  # 条件分支 — 使用 DIV_BR 宏
  # =========================================================================
  - name: branch
    template: branch
    desc: "Conditional branches (beq/bne/blt/bge/bltu/bgeu)"
    instructions:
      - { name: beq,  cond: "_a == _b",
          decode: { pattern: "??????? ????? ????? 000 ????? 11000 11",
                    type: TYPE_B, imm: immB } }
      - { name: bne,  cond: "_a != _b",
          decode: { pattern: "??????? ????? ????? 001 ????? 11000 11",
                    type: TYPE_B, imm: immB } }
      - { name: blt,  cond: "(int32_t)_a < (int32_t)_b",
          decode: { pattern: "??????? ????? ????? 100 ????? 11000 11",
                    type: TYPE_B, imm: immB } }
      - { name: bge,  cond: "(int32_t)_a >= (int32_t)_b",
          decode: { pattern: "??????? ????? ????? 101 ????? 11000 11",
                    type: TYPE_B, imm: immB } }
      - { name: bltu, cond: "_a < _b",
          decode: { pattern: "??????? ????? ????? 110 ????? 11000 11",
                    type: TYPE_B, imm: immB } }
      - { name: bgeu, cond: "_a >= _b",
          decode: { pattern: "??????? ????? ????? 111 ????? 11000 11",
                    type: TYPE_B, imm: immB } }

  # =========================================================================
  # Load: rd = sext/zext(mem[rs1+imm], width)
  # =========================================================================
  - name: load
    template: load
    desc: "Load (lb/lh/lw/lbu/lhu)"
    instructions:
      - { name: lb,  width: 1, extend: "sext", use_ctrl: false,
          decode: { pattern: "??????? ????? ????? 000 ????? 00000 11",
                    type: TYPE_I, imm: immI } }
      - { name: lh,  width: 2, extend: "sext", use_ctrl: false,
          decode: { pattern: "??????? ????? ????? 001 ????? 00000 11",
                    type: TYPE_I, imm: immI } }
      - { name: lw,  width: 4, extend: "none", use_ctrl: true,
          decode: { pattern: "??????? ????? ????? 010 ????? 00000 11",
                    type: TYPE_I, imm: immI } }
      - { name: lbu, width: 1, extend: "zext", use_ctrl: false,
          decode: { pattern: "??????? ????? ????? 100 ????? 00000 11",
                    type: TYPE_I, imm: immI } }
      - { name: lhu, width: 2, extend: "zext", use_ctrl: false,
          decode: { pattern: "??????? ????? ????? 101 ????? 00000 11",
                    type: TYPE_I, imm: immI } }

  # =========================================================================
  # Store: mem[rs1+imm] = rs2[7:0/15:0/31:0]
  # =========================================================================
  - name: store
    template: store
    desc: "Store (sb/sh/sw)"
    instructions:
      - { name: sb, width: 1,
          decode: { pattern: "??????? ????? ????? 000 ????? 01000 11",
                    type: TYPE_S, imm: immS } }
      - { name: sh, width: 2,
          decode: { pattern: "??????? ????? ????? 001 ????? 01000 11",
                    type: TYPE_S, imm: immS } }
      - { name: sw, width: 4,
          decode: { pattern: "??????? ????? ????? 010 ????? 01000 11",
                    type: TYPE_S, imm: immS } }

# ============================================================================
# 杂项指令 — 不属于任何 family, 每个独立模板处理
# ============================================================================
misc:
  - name: ebreak
    template: ebreak
    desc: "SIMT-aware breakpoint / reconvergence"
    decode: { pattern: "0000000 00001 00000 000 00000 11100 11",
              type: TYPE_I, imm: imm0 }
