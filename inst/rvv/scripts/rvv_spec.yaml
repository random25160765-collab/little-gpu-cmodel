# ============================================================================
# rvv_spec.yaml — RVV 1.0 完整指令规格
#
# 覆盖:
#   - 向量整数算术 (OPIVV/OPIVX/OPIVI): 二元, 比较, 移位, 最值, 乘除, 饱和, 平均
#   - 向量整数扩展: 宽化, 窄化, 符号扩展, 进位
#   - 向量浮点 (OPFVV/OPFVF): 二元, 一元, FMA, 最值, 符号注入, 分类
#   - 向量浮点扩展: 宽化, 窄化, 宽化FMA
#   - 向量归约 (整数+浮点)
#   - 向量掩码: 合并, 逻辑运算, 计数
#   - 向量排列: gather, compress, slide
#   - 向量访存: unit-stride, strided, indexed, whole-reg, fault-first
#   - 配置: vsetvli (占位)
#
# 每个族:
#   name:    族名（生成 rvv_{name}.h）
#   template:基础模板名 → Python 方法 tmpl_{template}_{form}
#   forms:   操作数形式（可被单条指令覆盖）
#   sew:     支持的 SEW
#   instructions[]: name / op / cmp / expr / init / itype
# ============================================================================

types:
  sew8:
    int: int8_t
    uint: uint8_t
  sew16:
    int: int16_t
    uint: uint16_t
  sew32:
    int: int32_t
    uint: uint32_t
    float: float
  sew64:
    int: int64_t
    uint: uint64_t
    float: double

families:

  # ========================================================================
  # §1  整数二元算术
  # ========================================================================
  - name: int_bin
    template: bin
    forms: [vv, vx, vi]
    sew: [8, 16, 32]
    instructions:
      - { name: vadd, op: "+", itype: int,
          decode: { label: "op_vadd_vv",
                    pattern: "000000? ????? ????? 000 ????? 10101 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vadd_vv", sew: [8, 16, 32] } } }
      - { name: vsub, op: "-", itype: int,
          decode: { label: "op_vsub_vv",
                    pattern: "000010? ????? ????? 000 ????? 10101 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vsub_vv", sew: [8, 16, 32] } } }
      - { name: vand, op: "&", itype: uint, forms: [vv, vi],
          decode: { label: "op_vand_vv",
                    pattern: "001001? ????? ????? 000 ????? 10101 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vand_vv", sew: [8, 16, 32] } } }
      - { name: vor,  op: "|", itype: uint, forms: [vv, vi],
          decode: { label: "op_vor_vv",
                    pattern: "001010? ????? ????? 000 ????? 10101 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vor_vv", sew: [8, 16, 32] } } }
      - { name: vxor, op: "^", itype: uint, forms: [vv, vi],
          decode: { label: "op_vxor_vv",
                    pattern: "001011? ????? ????? 000 ????? 10101 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vxor_vv", sew: [8, 16, 32] } } }

  # ========================================================================
  # §2  整数比较
  # ========================================================================
  - name: int_cmp
    template: cmp
    forms: [vv, vx]
    sew: [8, 16, 32]
    instructions:
      - { name: vmseq, op: "==", itype: int,
          decode: { label: "op_vmseq_vv",
                    pattern: "011000? ????? ????? 000 ????? 10101 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vmseq_vv", sew: [8, 16, 32] } } }
      - { name: vmsne, op: "!=", itype: int,
          decode: { label: "op_vmsne_vv",
                    pattern: "011001? ????? ????? 000 ????? 10101 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vmsne_vv", sew: [8, 16, 32] } } }
      - { name: vmslt, op: "<",  itype: int,
          decode: { label: "op_vmslt_vv",
                    pattern: "011011? ????? ????? 000 ????? 10101 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vmslt_vv", sew: [8, 16, 32] } } }
      - { name: vmsle, op: "<=", itype: int }
      - { name: vmsgt, op: ">",  itype: int }
      - { name: vmsge, op: ">=", itype: int }

  - name: int_cmpu
    template: cmp
    forms: [vv, vx]
    sew: [8, 16, 32]
    instructions:
      - { name: vmsltu, op: "<",  itype: uint,
          decode: { label: "op_vmsltu_vv",
                    pattern: "011010? ????? ????? 000 ????? 10101 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vmsltu_vv", sew: [8, 16, 32] } } }
      - { name: vmsleu, op: "<=", itype: uint }
      - { name: vmsgtu, op: ">",  itype: uint }
      - { name: vmsgeu, op: ">=", itype: uint }

  # ========================================================================
  # §3  整数移位
  # ========================================================================
  - name: int_shift
    template: shift
    forms: [vv, vx, vi]
    sew: [8, 16, 32]
    instructions:
      - { name: vsll, op: "<<", itype: int,
          decode: { label: "op_vsll_vv",
                    pattern: "100101? ????? ????? 000 ????? 10101 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vsll_vv", sew: [8, 16, 32] } } }
      - { name: vsrl, op: ">>", itype: uint,
          decode: { label: "op_vsrl_vv",
                    pattern: "101000? ????? ????? 000 ????? 10101 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vsrl_vv", sew: [8, 16, 32] } } }
      - { name: vsra, op: ">>", itype: int,
          decode: { label: "op_vsra_vv",
                    pattern: "101001? ????? ????? 000 ????? 10101 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vsra_vv", sew: [8, 16, 32] } } }

  # ========================================================================
  # §4  整数最值
  # ========================================================================
  - name: int_minmax
    template: minmax
    forms: [vv, vx]
    sew: [8, 16, 32]
    instructions:
      - { name: vmin,  cmp: "<", itype: int,
          decode: { label: "op_vmin_vv",
                    pattern: "000101? ????? ????? 000 ????? 10101 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vmin_vv", sew: [8, 16, 32] } } }
      - { name: vmax,  cmp: ">", itype: int,
          decode: { label: "op_vmax_vv",
                    pattern: "000111? ????? ????? 000 ????? 10101 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vmax_vv", sew: [8, 16, 32] } } }
      - { name: vminu, cmp: "<", itype: uint,
          decode: { label: "op_vminu_vv",
                    pattern: "000100? ????? ????? 000 ????? 10101 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vminu_vv", sew: [8, 16, 32] } } }
      - { name: vmaxu, cmp: ">", itype: uint,
          decode: { label: "op_vmaxu_vv",
                    pattern: "000110? ????? ????? 000 ????? 10101 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vmaxu_vv", sew: [8, 16, 32] } } }

  # ========================================================================
  # §5  整数乘除
  # ========================================================================
  - name: int_muldiv
    template: muldiv
    forms: [vv, vx]
    sew: [8, 16, 32]
    instructions:
      - { name: vmul,   op: "*",  itype: int }
      - { name: vmulh,  op: "mh", itype: int }
      - { name: vmulhu, op: "mh", itype: uint }
      - { name: vmulhsu, op: "mhsu", itype: int }
      - { name: vdiv,   op: "/",  itype: int }
      - { name: vdivu,  op: "/",  itype: uint }
      - { name: vrem,   op: "%",  itype: int }
      - { name: vremu,  op: "%",  itype: uint }

  # ========================================================================
  # §6  整数饱和
  # ========================================================================
  - name: int_sat
    template: sat
    forms: [vv, vx, vi]
    sew: [8, 16, 32]
    instructions:
      - { name: vsadd,  op: "+", itype: int }
      - { name: vssub,  op: "-", itype: int }
      - { name: vsaddu, op: "+", itype: uint }
      - { name: vssubu, op: "-", itype: uint }

  # ========================================================================
  # §7  整数平均
  # ========================================================================
  - name: int_avg
    template: avg
    forms: [vv, vx]
    sew: [8, 16, 32]
    instructions:
      - { name: vaadd,  op: "+", itype: int }
      - { name: vasub,  op: "-", itype: int }
      - { name: vaaddu, op: "+", itype: uint }
      - { name: vasubu, op: "-", itype: uint }

  # ========================================================================
  # §8  整数宽化 (dst EEW = 2×SEW)
  # ========================================================================
  - name: int_widen
    template: widen
    forms: [vv, vx]
    sew: [8, 16]
    instructions:
      - { name: vwadd,  op: "+",  itype: int }
      - { name: vwsub,  op: "-",  itype: int }
      - { name: vwmul,  op: "*",  itype: int }
      - { name: vwaddu, op: "+",  itype: uint }
      - { name: vwsubu, op: "-",  itype: uint }
      - { name: vwmulu, op: "*",  itype: uint }

  # ========================================================================
  # §9  整数窄化 (dst EEW = SEW/2)
  # ========================================================================
  - name: int_narrow
    template: narrow
    forms: [vv, vx, vi]
    sew: [16, 32]
    instructions:
      - { name: vnsrl, op: ">>", itype: uint }
      - { name: vnsra, op: ">>", itype: int }

  # ========================================================================
  # §10 整数符号扩展
  # ========================================================================
  - name: int_ext
    template: ext
    forms: [v]
    sew: [8, 16]
    instructions:
      - { name: vsext_vf2, itype: int,  factor: 2 }
      - { name: vsext_vf4, itype: int,  factor: 4 }
      - { name: vzext_vf2, itype: uint, factor: 2 }
      - { name: vzext_vf4, itype: uint, factor: 4 }

  # ========================================================================
  # §11 进位
  # ========================================================================
  - name: int_carry
    template: carry
    forms: [vv, vx, vi]
    sew: [8, 16, 32]
    instructions:
      - { name: vmadc,  op: "+", itype: uint }
      - { name: vmsbc,  op: "-", itype: uint }

  # ========================================================================
  # §12 浮点二元
  # ========================================================================
  - name: float_bin
    template: fbin
    forms: [vv, vf]
    sew: [32]
    instructions:
      - { name: vfadd, op: "+", itype: float }
      - { name: vfsub, op: "-", itype: float }
      - { name: vfmul, op: "*", itype: float,
          decode: { label: "op_vfmul_vv",
                    pattern: "100100? ????? ????? 001 ????? 10101 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vfmul_vv", sew: [32] } } }
      - { name: vfdiv, op: "/", itype: float }

  # ========================================================================
  # §13 浮点一元 (仅 RVV 1.0 标准指令)
  #   vfsqrt.v  — 平方根
  #   vfrec7.v  — 7-bit 精度倒数近似
  #   vfclass.v — 已在 §16 float_fclass
  #   自定义快速数学 (vfexp, vfln, vfrcp, vfrsqrt, vftanh, vfsigmoid)
  #     属于 SFU 模块, 见 inst/sf/
  # ========================================================================
  - name: float_unary
    template: funary
    forms: [v]
    sew: [32]
    instructions:
      - { name: vfsqrt, expr: "sqrtf(v)", itype: float }
      - { name: vfrec7, expr: "1.0f / v", itype: float }

  # ========================================================================
  # §14 浮点最值 (复用 minmax 模板)
  # ========================================================================
  - name: float_minmax
    template: minmax
    forms: [vv, vf]
    sew: [32]
    instructions:
      - { name: vfmin, cmp: "<", itype: float }
      - { name: vfmax, cmp: ">", itype: float }

  # ========================================================================
  # §15 浮点符号注入
  # ========================================================================
  - name: float_fsgnj
    template: fsgnj
    forms: [vv, vf]
    sew: [32]
    instructions:
      - { name: vfsgnj,  op: "j",  itype: float }
      - { name: vfsgnjn, op: "jn", itype: float }
      - { name: vfsgnjx, op: "jx", itype: float }

  # ========================================================================
  # §16 浮点分类
  # ========================================================================
  - name: float_fclass
    template: fclass
    forms: [v]
    sew: [32]
    instructions:
      - { name: vfclass, itype: float }

  # ========================================================================
  # §17 浮点 FMA — vd[i] = expr(vs1[i], vs2[i], vd[i])
  # ========================================================================
  - name: float_fma
    template: fma
    forms: [vv, vf]
    sew: [32]
    instructions:
      - { name: vfmacc,   expr: "a * b + d", itype: float }
      - { name: vfnmacc,  expr: "-(a * b) - d", itype: float }
      - { name: vfmsac,   expr: "a * b - d", itype: float }
      - { name: vfnmsac,  expr: "d - a * b", itype: float }

  # ========================================================================
  # §18 浮点宽化 (dst EEW = 2×SEW)
  # ========================================================================
  - name: float_widen
    template: fwiden
    forms: [vv, vf]
    sew: [32]
    instructions:
      - { name: vfwadd, op: "+", itype: float }
      - { name: vfwsub, op: "-", itype: float }
      - { name: vfwmul, op: "*", itype: float }

  # ========================================================================
  # §19 浮点宽化 FMA
  # ========================================================================
  - name: float_widen_fma
    template: fwiden_fma
    forms: [vv, vf]
    sew: [32]
    instructions:
      - { name: vfwmacc,  expr: "a * b + d", itype: float }
      - { name: vfwnmacc, expr: "-(a * b) - d", itype: float }
      - { name: vfwmsac,  expr: "a * b - d", itype: float }
      - { name: vfwnmsac, expr: "d - a * b", itype: float }

  # ========================================================================
  # §20 浮点窄化转换
  # ========================================================================
  - name: float_narrow
    template: fnarrow
    forms: [v]
    sew: [32]
    instructions:
      - { name: vfncvt_rod, itype: float }

  # ========================================================================
  # §21 整数归约
  # ========================================================================
  - name: reduce_int
    template: reduce
    forms: [vs]
    sew: [8, 16, 32]
    instructions:
      - { name: vredsum,  op: "+",  init: "0", itype: int }
      - { name: vredmax,  op: "max", init: "INT_MIN", itype: int }
      - { name: vredmin,  op: "min", init: "INT_MAX", itype: int }
      - { name: vredand,  op: "&",  init: "~0", itype: uint }
      - { name: vredor,   op: "|",  init: "0", itype: uint }
      - { name: vredxor,  op: "^",  init: "0", itype: uint }
      - { name: vredmaxu, op: "max", init: "0", itype: uint }
      - { name: vredminu, op: "min", init: "UINT_MAX", itype: uint }

  # ========================================================================
  # §22 浮点归约
  # ========================================================================
  - name: reduce_float
    template: freduce
    forms: [vs]
    sew: [32]
    instructions:
      - { name: vfredsum,  op: "+",  init: "0.0f", itype: float }
      - { name: vfredmax,  op: "max", init: "-INFINITY", itype: float }
      - { name: vfredmin,  op: "min", init: "INFINITY", itype: float }

  # ========================================================================
  # §23 掩码合并
  # ========================================================================
  - name: mask
    template: merge
    forms: [vvm]
    sew: [8, 16, 32]
    instructions:
      - { name: vmerge,  itype: uint,
          decode: { label: "op_vmerge_vvm",
                    pattern: "0101110 ????? ????? 000 ????? 10101 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vmerge_vvm", sew: [8, 16, 32] } } }
      - { name: vfmerge, itype: float, sew_exclude: [8, 16] }

  # ========================================================================
  # §24 掩码逻辑运算 — vd[i] = expr(vs1[i], vs2[i])
  # ========================================================================
  - name: mask_ops
    template: mask_bin
    forms: [vv]
    sew: [8, 16, 32]
    instructions:
      - { name: vmand,    expr: "a & b",   itype: uint }
      - { name: vmor,     expr: "a | b",   itype: uint }
      - { name: vmxor,    expr: "a ^ b",   itype: uint }
      - { name: vmnand,   expr: "~(a & b)", itype: uint }
      - { name: vmnor,    expr: "~(a | b)", itype: uint }
      - { name: vmxnor,   expr: "~(a ^ b)", itype: uint }
      - { name: vmandnot, expr: "a & ~b",  itype: uint }
      - { name: vmornot,  expr: "a | ~b",  itype: uint }

  # ========================================================================
  # §25 掩码计数
  # ========================================================================
  - name: mask_count
    template: mcount
    forms: [v]
    sew: [8, 16, 32]
    instructions:
      - { name: vcpop,  op: "cpop", itype: uint }
      - { name: vfirst, op: "first", itype: uint }
      - { name: vmsbf,  op: "msbf", itype: uint }
      - { name: vmsif,  op: "msif", itype: uint }
      - { name: vmsof,  op: "msof", itype: uint }
      - { name: viota,  op: "iota", itype: uint }
      - { name: vid,    op: "id", itype: uint }

  # ========================================================================
  # §26 Unit-stride Load/Store
  # ========================================================================
  - name: ldst
    template: ldst
    forms: [v]
    sew: [8, 16, 32]
    instructions:
      - { name: vle, dir: "ld", itype: uint,
          decode: { label: "op_vle32_v",
                    pattern: "000000? 00000 ????? 110 ????? 00001 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vle_v", sew: [32] } } }
      - { name: vse, dir: "st", itype: uint,
          decode: { label: "op_vse32_v",
                    pattern: "000000? 00000 ????? 110 ????? 01001 11",
                    type: TYPE_R, imm: imm0,
                    variants: { base: "vse_v", sew: [32] } } }

  # ========================================================================
  # §27 Strided Load/Store
  # ========================================================================
  - name: ldst_strided
    template: strided
    forms: [v]
    sew: [8, 16, 32]
    instructions:
      - { name: vlse, dir: "ld", itype: uint }
      - { name: vsse, dir: "st", itype: uint }

  # ========================================================================
  # §28 Indexed Load/Store (gather/scatter)
  # ========================================================================
  - name: ldst_indexed
    template: indexed
    forms: [vv]
    sew: [8, 16, 32]
    instructions:
      - { name: vluxei, dir: "ld", itype: uint }
      - { name: vsuxei, dir: "st", itype: uint }

  # ========================================================================
  # §29 Whole-register Load/Store
  # ========================================================================
  - name: ldst_whole
    template: wreg
    forms: [v]
    sew: [8, 16, 32]
    instructions:
      - { name: vlr, dir: "ld", itype: uint }
      - { name: vsr, dir: "st", itype: uint }

  # ========================================================================
  # §30 Fault-only-first Load
  # ========================================================================
  - name: ldst_ff
    template: ff
    forms: [v]
    sew: [8, 16, 32]
    instructions:
      - { name: vleff, dir: "ld", itype: uint }

  # ========================================================================
  # §31 排列 (gather / compress)
  # ========================================================================
  - name: permute
    template: perm
    forms: [vv, vx]
    sew: [8, 16, 32]
    instructions:
      - { name: vrgather, op: "gather", itype: uint }
      - { name: vcompress, op: "compress", itype: uint }

  # ========================================================================
  # §32 滑窗
  # ========================================================================
  - name: slide
    template: slide
    forms: [vx, vi]
    sew: [8, 16, 32]
    instructions:
      - { name: vslideup,   op: "up", itype: uint }
      - { name: vslidedown, op: "down", itype: uint }
      - { name: vslide1up,   op: "1up", itype: uint }
      - { name: vslide1down, op: "1down", itype: uint }

  # ========================================================================
  # §33 配置 (占位 — 实际在 engine.c 的 vsetvli handler)
  # ========================================================================
  - name: config
    template: config
    forms: [v]
    sew: [32]
    instructions:
      - { name: vsetvli, itype: int,
          decode: { label: "op_vsetvli",
                    pattern: "0?????? ????? ????? 111 ????? 10101 11",
                    type: TYPE_R, imm: imm0 } }

# ============================================================================
# misc — 多 form 指令的额外 dispatch 条目
# (一条 spec 指令 = 多个 form = 多个 bit pattern = 多个 dispatch slot)
# ============================================================================
misc:
  # vfmul_vf: opcode 0x57, funct3=101 (OPFVF), 和 float_bin 的 vfmul.vv 共用 handler
  - { name: vfmul_vf, template: fbin, form: vf,
      decode: { label: "op_vfmul_vf",
                pattern: "100100? ????? ????? 101 ????? 10101 11",
                type: TYPE_R, imm: imm0,
                variants: { base: "vfmul_vf", sew: [32] } } }
